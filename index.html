<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-Mart | Online Shopping</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f5f5;
  color:#222;
}

header{
  background:#2874f0;
  color:white;
  padding:16px;
  text-align:center;
}

header h1{
  font-size:28px;
  margin-bottom:12px;
}

.search{
  width:90%;
  max-width:500px;
  padding:12px;
  border:0;
  border-radius:6px;
  font-size:15px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.install{
  display:none;
  width:100%;
  padding:13px;
  margin-bottom:15px;
  background:#ff9f00;
  color:white;
  border:0;
  border-radius:7px;
  font-weight:bold;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
}

.empty{
  grid-column:1/-1;
  background:white;
  padding:50px 20px;
  text-align:center;
  border-radius:10px;
}

.checkout{
  background:white;
  margin-top:20px;
  padding:20px;
  border-radius:10px;
}

.checkout input,
.checkout textarea,
.checkout select{
  width:100%;
  padding:12px;
  margin:7px 0;
  border:1px solid #ccc;
  border-radius:6px;
}

.checkout textarea{
  min-height:100px;
  resize:vertical;
}

.place{
  width:100%;
  padding:12px;
  background:#2874f0;
  color:white;
  border:0;
  border-radius:6px;
  font-weight:bold;
}

#message{
  margin-top:12px;
  font-weight:bold;
}

footer{
  text-align:center;
  padding:25px;
  color:#777;
}
</style>
</head>

<body>

<header>
  <h1>🛒 K-Mart</h1>

  <input
    class="search"
    id="search"
    type="text"
    placeholder="Search products..."
    oninput="searchProducts()"
  >
</header>

<div class="container">

  <button id="installBtn" class="install">
    📱 Install K-Mart App
  </button>

  <section class="products" id="products">

    <div class="empty">
      <h2>Welcome to K-Mart</h2>
      <p>Your products will appear here.</p>
    </div>

  </section>

  <section class="checkout">

    <h2>🛍️ Checkout</h2>

    <p id="cartInfo">No product selected.</p>

    <input id="name" type="text" placeholder="Full Name">

    <input id="phone" type="tel" placeholder="Phone Number">

    <textarea
      id="address"
      placeholder="Delivery Address"
    ></textarea>

    <select id="payment">
      <option value="">Select Payment Method</option>
      <option>Cash on Delivery</option>
      <option>UPI</option>
      <option>Card</option>
    </select>

    <button class="place" onclick="placeOrder()">
      Place Order
    </button>

    <p id="message"></p>

  </section>

</div>

<footer>
  © 2026 K-Mart
</footer>

<script>

let selectedProduct = "";

function buyNow(name,price){

  selectedProduct = name + " - ₹" + price;

  document.getElementById("cartInfo").innerText =
    "Selected: " + selectedProduct;

  window.scrollTo({
    top:document.body.scrollHeight,
    behavior:"smooth"
  });
}

function placeOrder(){

  const name =
    document.getElementById("name").value;

  const phone =
    document.getElementById("phone").value;

  const address =
    document.getElementById("address").value;

  const payment =
    document.getElementById("payment").value;

  if(!selectedProduct){

    document.getElementById("message").innerText =
      "⚠️ Please select a product first.";

    return;
  }

  if(!name || !phone || !address || !payment){

    document.getElementById("message").innerText =
      "⚠️ Please fill all details.";

    return;
  }

  document.getElementById("message").innerText =
    "✅ Order information received.";
}

function searchProducts(){

  const value =
    document.getElementById("search").value.toLowerCase();

  document.querySelectorAll(".card").forEach(card => {

    const text =
      card.innerText.toLowerCase();

    card.style.display =
      text.includes(value) ? "block" : "none";

  });
}

</script>
<!-- Seller Login -->
<div id="sellerLogin" style="display:none; padding:20px; text-align:center;">
  <h2>Seller Login</h2>
  <input type="password" id="sellerPin" placeholder="Enter Seller PIN"
         style="padding:12px; width:90%; max-width:300px;">
  <button onclick="checkSellerPin()"
          style="padding:12px 20px; margin-top:10px;">
    Login
  </button>
  <p id="pinMessage"></p>
</div>

<script>
const SELLER_PIN = "NK99@#";

function checkSellerPin() {
  const pin = document.getElementById("sellerPin").value;
  const message = document.getElementById("pinMessage");

  if (pin === SELLER_PIN) {
    message.textContent = "Seller Login Successful!";
    message.style.color = "green";
  } else {
    message.textContent = "Wrong Seller PIN!";
    message.style.color = "red";
  }
}
</script>
  <!-- K-Mart Buy Now + Cart -->
<div id="kmartCart" style="position:fixed;right:15px;bottom:15px;z-index:9999;">
  <button onclick="openCart()" style="padding:12px 18px;border:0;border-radius:8px;background:#2874f0;color:white;font-weight:bold;">
    🛒 Cart (<span id="cartCount">0</span>)
  </button>
</div>

<div id="cartBox" style="display:none;position:fixed;right:15px;bottom:70px;width:300px;max-width:90%;background:white;padding:20px;border-radius:12px;box-shadow:0 4px 20px #777;z-index:9999;">
  <h2>My Cart</h2>
  <div id="cartItems"></div>
  <button onclick="closeCart()" style="padding:10px;margin-top:10px;">Close</button>
</div>

<script>
let kmartCart = [];

function buyNow(productName, price) {
  kmartCart.push({name: productName, price: price});
  updateCart();
  openCart();
}

function updateCart() {
  document.getElementById("cartCount").textContent = kmartCart.length;

  let items = "";
  kmartCart.forEach((item, index) => {
    items += `
      <div style="padding:10px 0;border-bottom:1px solid #ddd;">
        <b>${item.name}</b><br>
        ₹${item.price}
        <button onclick="removeItem(${index})" style="margin-left:10px;">
          Remove
        </button>
      </div>`;
  });

  document.getElementById("cartItems").innerHTML =
    items || "<p>Your cart is empty.</p>";
}

function removeItem(index) {
  kmartCart.splice(index, 1);
  updateCart();
}

function openCart() {
  document.getElementById("cartBox").style.display = "block";
}

function closeCart() {
  document.getElementById("cartBox").style.display = "none";
}
</script>
</body>
</html>
