<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-Mart | Online Shopping</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f5f5;
  color:#222;
}

header{
  background:#2874f0;
  color:white;
  padding:16px;
  text-align:center;
}

header h1{
  font-size:28px;
  margin-bottom:12px;
}

.search{
  width:90%;
  max-width:500px;
  padding:12px;
  border:0;
  border-radius:6px;
  font-size:15px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
}

.card{
  background:white;
  border-radius:10px;
  padding:12px;
  box-shadow:0 2px 8px #ddd;
  text-align:center;
}

.card img{
  width:100%;
  height:180px;
  object-fit:cover;
  border-radius:8px;
}

.card h3{
  margin:10px 0 5px;
}

.price{
  color:#2874f0;
  font-size:20px;
  font-weight:bold;
  margin:8px;
}

.buy{
  width:100%;
  padding:11px;
  border:0;
  border-radius:6px;
  background:#ff9f00;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.cart-button{
  position:fixed;
  right:15px;
  bottom:15px;
  z-index:9999;
  padding:13px 18px;
  border:0;
  border-radius:8px;
  background:#2874f0;
  color:white;
  font-weight:bold;
}

.cart-box{
  display:none;
  position:fixed;
  right:15px;
  bottom:70px;
  width:320px;
  max-width:90%;
  max-height:70vh;
  overflow:auto;
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 4px 20px #777;
  z-index:9999;
}

.checkout,
.seller{
  background:white;
  margin-top:25px;
  padding:20px;
  border-radius:10px;
  box-shadow:0 2px 8px #ddd;
}

.checkout input,
.checkout textarea,
.checkout select,
.seller input{
  width:100%;
  padding:12px;
  margin:7px 0;
  border:1px solid #ccc;
  border-radius:6px;
}

.checkout textarea{
  min-height:100px;
}

.place,
.seller button{
  width:100%;
  padding:12px;
  border:0;
  border-radius:6px;
  background:#2874f0;
  color:white;
  font-weight:bold;
}

#message{
  margin-top:12px;
  font-weight:bold;
}

#sellerForm{
  display:none;
  margin-top:15px;
}

footer{
  text-align:center;
  padding:25px;
  color:#777;
}
</style>
</head>

<body>

<header>
  <h1>🛒 K-Mart</h1>

  <input
    class="search"
    id="search"
    type="text"
    placeholder="Search products..."
    oninput="searchProducts()"
  >
</header>

<div class="container">

  <h2 style="margin-bottom:15px;">🛍️ Products</h2>

  <section class="products" id="products">

    <div class="card">
      <img src="https://via.placeholder.com/300x200?text=Mobile" alt="Mobile">
      <h3>Smartphone</h3>
      <p class="price">₹9,999</p>
      <button class="buy" onclick="buyNow('Smartphone',9999)">
        ⚡ Buy Now
      </button>
    </div>

    <div class="card">
      <img src="https://via.placeholder.com/300x200?text=Headphones" alt="Headphones">
      <h3>Wireless Headphones</h3>
      <p class="price">₹1,499</p>
      <button class="buy" onclick="buyNow('Wireless Headphones',1499)">
        ⚡ Buy Now
      </button>
    </div>

    <div class="card">
      <img src="https://via.placeholder.com/300x200?text=Watch" alt="Watch">
      <h3>Smart Watch</h3>
      <p class="price">₹2,499</p>
      <button class="buy" onclick="buyNow('Smart Watch',2499)">
        ⚡ Buy Now
      </button>
    </div>

    <div class="card">
      <img src="https://via.placeholder.com/300x200?text=Shoes" alt="Shoes">
      <h3>Sports Shoes</h3>
      <p class="price">₹1,999</p>
      <button class="buy" onclick="buyNow('Sports Shoes',1999)">
        ⚡ Buy Now
      </button>
    </div>

  </section>

  <section class="checkout">

    <h2>🛍️ Checkout</h2>

    <p id="cartInfo" style="margin:10px 0;">
      No product selected.
    </p>

    <input id="name" type="text" placeholder="Full Name">

    <input id="phone" type="tel" placeholder="Phone Number">

    <textarea id="address" placeholder="Delivery Address"></textarea>

    <select id="payment">
      <option value="">Select Payment Method</option>
      <option>Cash on Delivery</option>
      <option>UPI</option>
      <option>Card</option>
    </select>

    <button class="place" onclick="placeOrder()">
      Place Order
    </button>

    <p id="message"></p>

  </section>

  <section class="seller">

    <h2>🏪 K-Mart Seller Panel</h2>

    <input
      type="password"
      id="sellerPin"
      placeholder="Enter Seller PIN"
    >

    <button onclick="sellerLogin()">
      🔐 Seller Login
    </button>

    <div id="sellerForm">

      <input
        type="text"
        id="productName"
        placeholder="Product Name"
      >

      <input
        type="number"
        id="productPrice"
        placeholder="Price ₹"
      >

      <input
        type="url"
        id="productImage"
        placeholder="Product Image URL"
      >

      <button onclick="addProduct()">
        ➕ Add Product
      </button>

    </div>

  </section>

</div>

<button class="cart-button" onclick="openCart()">
  🛒 Cart (<span id="cartCount">0</span>)
</button>

<div class="cart-box" id="cartBox">

  <h2>🛒 My Cart</h2>

  <div id="cartItems" style="margin-top:10px;"></div>

  <button
    onclick="closeCart()"
    style="padding:10px;margin-top:15px;"
  >
    Close
  </button>

</div>

<footer>
  © 2026 K-Mart | Online Shopping
</footer>

<script>

let selectedProduct = "";
let kmartCart = [];

function buyNow(name, price){

  selectedProduct = name + " - ₹" + price;

  document.getElementById("cartInfo").innerText =
    "Selected: " + selectedProduct;

  kmartCart.push({
    name:name,
    price:price
  });

  updateCart();

  window.scrollTo({
    top:document.body.scrollHeight,
    behavior:"smooth"
  });
}

function updateCart(){

  document.getElementById("cartCount").innerText =
    kmartCart.length;

  let html = "";

  kmartCart.forEach(function(item,index){

    html += `
      <div style="padding:10px 0;border-bottom:1px solid #ddd;">
        <b>${item.name}</b>
        <br>
        ₹${item.price}
        <br>
        <button onclick="removeItem(${index})"
          style="margin-top:6px;padding:6px;">
          Remove
        </button>
      </div>
    `;

  });

  document.getElementById("cartItems").innerHTML =
    html || "<p>Your cart is empty.</p>";
}

function removeItem(index){

  kmartCart.splice(index,1);

  updateCart();
}

function openCart(){

  document.getElementById("cartBox").style.display =
    "block";
}

function closeCart(){

  document.getElementById("cartBox").style.display =
    "none";
}

function placeOrder(){

  const name =
    document.getElementById("name").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  const address =
    document.getElementById("address").value.trim();

  const payment =
    document.getElementById("payment").value;

  const message =
    document.getElementById("message");

  if(!selectedProduct){

    message.innerText =
      "⚠️ Please select a product first.";

    message.style.color = "red";

    return;
  }

  if(!name || !phone || !address || !payment){

    message.innerText =
      "⚠️ Please fill all details.";

    message.style.color = "red";

    return;
  }

  message.innerText =
    "✅ Order information received successfully!";

  message.style.color = "green";
}

function searchProducts(){

  const value =
    document.getElementById("search").value.toLowerCase();

  document.querySelectorAll(".card").forEach(function(card){

    const text =
      card.innerText.toLowerCase();

    card.style.display =
      text.includes(value) ? "block" : "none";

  });
}

function sellerLogin(){

  const pin =
    document.getElementById("sellerPin").value;

  if(pin === "NK99@#"){

    document.getElementById("sellerForm").style.display =
      "block";

    alert("Seller Login Successful!");

  }else{

    alert("Wrong Seller PIN!");

  }
}

function addProduct(){

  const name =
    document.getElementById("productName").value.trim();

  const price =
    document.getElementById("productPrice").value;

  const image =
    document.getElementById("productImage").value.trim();

  if(!name || !price || !image){

    alert("Product name, price aur image URL fill karo.");

    return;
  }

  const products =
    document.getElementById("products");

  const card =
    document.createElement("div");

  card.className = "card";

  card.innerHTML = `
    <img src="${image}" alt="${name}">
    <h3>${name}</h3>
    <p class="price">₹${price}</p>
    <button class="buy"
      onclick="buyNow('${name.replace(/'/g,"\\'")}',${price})">
      ⚡ Buy Now
    </button>
  `;

  products.appendChild(card);

  document.getElementById("productName").value = "";
  document.getElementById("productPrice").value = "";
  document.getElementById("productImage").value = "";

  alert("✅ Product added!");
}

</script>

</body>
</html>
