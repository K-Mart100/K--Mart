8<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-Mart | Online Shopping</title>
  
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyC1cA4QTHLqHutL0BCbs77MjTdpjBA0uQw",
  authDomain: "k-mart-cb6cf.firebaseapp.com",
  projectId: "k-mart-cb6cf",
  storageBucket: "k-mart-cb6cf.firebasestorage.app",
  messagingSenderId: "187616753212",
  appId: "1:187616753212:web:a036ca693b9a52673cf539",
  measurementId: "G-PYQNK97XXP"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.kmartSignup = async function() {
  const email = document.getElementById("customerEmail").value.trim();
  const password = document.getElementById("customerPassword").value;

  if (!email || !password) {
    alert("Email aur password enter karo.");
    return;
  }

  try {
    await createUserWithEmailAndPassword(auth, email, password);
    alert("✅ K-Mart account created!");
  } catch (error) {
    alert("❌ " + error.message);
  }
};

window.kmartLogin = async function() {
  const email = document.getElementById("customerEmail").value.trim();
  const password = document.getElementById("customerPassword").value;

  if (!email || !password) {
    alert("Email aur password enter karo.");
    return;
  }

  try {
    await signInWithEmailAndPassword(auth, email, password);
    alert("✅ Login successful!");
  } catch (error) {
    alert("❌ Login failed: " + error.message);
  }
};

window.kmartLogout = async function() {
  try {
    await signOut(auth);
    alert("✅ Logged out!");
  } catch (error) {
    alert("❌ " + error.message);
  }
};

onAuthStateChanged(auth, (user) => {
  const status = document.getElementById("loginStatus");

  if (status) {
    status.innerText = user
      ? "🟢 Logged in: " + user.email
      : "🔴 Not logged in";
  }
});
</script>
  
<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f5f5;
  color:#222;
}

header{
  background:#2874f0;
  color:white;
  padding:16px;
  text-align:center;
}

header h1{
  font-size:28px;
  margin-bottom:12px;
}

.search{
  width:90%;
  max-width:500px;
  padding:12px;
  border:0;
  border-radius:6px;
  font-size:15px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
}

.card{
  background:white;
  border-radius:10px;
  padding:12px;
  box-shadow:0 2px 8px #ddd;
  text-align:center;
}

.card img{
  width:100%;
  height:180px;
  object-fit:cover;
  border-radius:8px;
}

.card h3{
  margin:10px 0 5px;
}

.price{
  color:#2874f0;
  font-size:20px;
  font-weight:bold;
  margin:8px;
}

.buttons{
  display:flex;
  gap:8px;
}

.buy,.cart-add{
  flex:1;
  padding:11px 5px;
  border:0;
  border-radius:6px;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.buy{
  background:#ff9f00;
}

.cart-add{
  background:#2874f0;
}

.checkout,.seller{
  background:white;
  margin-top:25px;
  padding:20px;
  border-radius:10px;
  box-shadow:0 2px 8px #ddd;
}

.checkout input,
.checkout textarea,
.checkout select,
.seller input{
  width:100%;
  padding:12px;
  margin:7px 0;
  border:1px solid #ccc;
  border-radius:6px;
}

.checkout textarea{
  min-height:100px;
}

.place,.seller button{
  width:100%;
  padding:12px;
  border:0;
  border-radius:6px;
  background:#2874f0;
  color:white;
  font-weight:bold;
}

#message{
  margin-top:12px;
  font-weight:bold;
}

#sellerForm{
  display:none;
  margin-top:15px;
}

.cart-button{
  position:fixed;
  right:15px;
  bottom:15px;
  z-index:9999;
  padding:13px 18px;
  border:0;
  border-radius:8px;
  background:#2874f0;
  color:white;
  font-weight:bold;
}

.cart-box{
  display:none;
  position:fixed;
  right:15px;
  bottom:70px;
  width:320px;
  max-width:90%;
  max-height:70vh;
  overflow:auto;
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 4px 20px #777;
  z-index:9999;
}

.qty button{
  padding:4px 9px;
  margin:4px;
}

footer{
  text-align:center;
  padding:25px;
  color:#777;
}
</style>
</head>

<body>

<header>
<h1>🛒 K-Mart</h1>

<input
class="search"
id="search"
type="text"
placeholder="Search products..."
oninput="searchProducts()">
</header>

<div class="container">

<h2 style="margin-bottom:15px;">🛍️ Products</h2>

<section class="products" id="products">

<div class="card">
<img src="https://via.placeholder.com/300x200?text=Mobile" alt="Mobile">
<h3>Smartphone</h3>
<p class="price">₹9,999</p>

<div class="buttons">
<button class="cart-add" onclick="addToCart('Smartphone',9999)">
🛒 Cart
</button>

<button class="buy" onclick="buyNow('Smartphone',9999)">
⚡ Buy
</button>
</div>
</div>

<div class="card">
<img src="https://via.placeholder.com/300x200?text=Headphones" alt="Headphones">
<h3>Wireless Headphones</h3>
<p class="price">₹1,499</p>

<div class="buttons">
<button class="cart-add" onclick="addToCart('Wireless Headphones',1499)">
🛒 Cart
</button>

<button class="buy" onclick="buyNow('Wireless Headphones',1499)">
⚡ Buy
</button>
</div>
</div>

<div class="card">
<img src="https://via.placeholder.com/300x200?text=Watch" alt="Watch">
<h3>Smart Watch</h3>
<p class="price">₹2,499</p>

<div class="buttons">
<button class="cart-add" onclick="addToCart('Smart Watch',2499)">
🛒 Cart
</button>

<button class="buy" onclick="buyNow('Smart Watch',2499)">
⚡ Buy
</button>
</div>
</div>

<div class="card">
<img src="https://via.placeholder.com/300x200?text=Shoes" alt="Shoes">
<h3>Sports Shoes</h3>
<p class="price">₹1,999</p>

<div class="buttons">
<button class="cart-add" onclick="addToCart('Sports Shoes',1999)">
🛒 Cart
</button>

<button class="buy" onclick="buyNow('Sports Shoes',1999)">
⚡ Buy
</button>
</div>
</div>

</section>

<section class="checkout">

<h2>🛍️ Checkout</h2>

<p id="cartInfo" style="margin:10px 0;">
No product selected.
</p>

<input id="name" type="text" placeholder="Full Name">

<input id="phone" type="tel" placeholder="Phone Number">

<textarea id="address" placeholder="Delivery Address"></textarea>

<select id="payment">
<option value="">Select Payment Method</option>
<option>Cash on Delivery</option>
<option>UPI</option>
<option>Card</option>
</select>

<button class="place" onclick="placeOrder()">
Place Order
</button>

<p id="message"></p>

</section>

<section class="seller">

<h2>🏪 K-Mart Seller Panel</h2>

<input
type="password"
id="sellerPin"
placeholder="Enter Seller PIN">

<button onclick="sellerLogin()">
🔐 Seller Login
</button>

<div id="sellerForm">

<input
type="text"
id="productName"
placeholder="Product Name">

<input
type="number"
id="productPrice"
placeholder="Price ₹">
<textarea
id="productDetails"
placeholder="Product Details"
style="width:100%;padding:12px;margin:7px 0;border:1px solid #ccc;border-radius:6px;"></textarea>
<input
type="url"
id="productImage"
placeholder="Product Image URL">
<input
type="number"
id="productStock"
placeholder="Stock Quantity"
min="0">
<button onclick="addProduct()">
➕ Add Product
</button>

</div>

</section>

</div>

<button class="cart-button" onclick="openCart()">
🛒 Cart (<span id="cartCount">0</span>)
</button>

<div class="cart-box" id="cartBox">

<h2>🛒 My Cart</h2>

<div id="cartItems" style="margin-top:10px;"></div>

<button onclick="closeCart()" style="padding:10px;margin-top:15px;">
Close
</button>

</div>

<footer>
© 2026 K-Mart | Online Shopping
</footer>

<script>

let kmartCart=[];
let selectedProduct="";

function addToCart(name,price){

let existing=kmartCart.find(item=>item.name===name);

if(existing){
existing.qty++;
}else{
kmartCart.push({
name:name,
price:price,
qty:1
});
}

selectedProduct=name+" - ₹"+price;

document.getElementById("cartInfo").innerText=
"Selected: "+selectedProduct;

updateCart();

alert("✅ Product added to cart!");

}

function buyNow(name,price){

selectedProduct=name+" - ₹"+price;

document.getElementById("cartInfo").innerText=
"Selected: "+selectedProduct;

window.scrollTo({
top:document.body.scrollHeight,
behavior:"smooth"
});

}

function updateCart(){

let totalItems=0;

kmartCart.forEach(item=>{
totalItems+=item.qty;
});

document.getElementById("cartCount").innerText=totalItems;

let html="";

kmartCart.forEach(function(item,index){

html+=`
<div style="padding:10px 0;border-bottom:1px solid #ddd;">

<b>${item.name}</b>

<br>

₹${item.price} × ${item.qty}

<div class="qty">

<button onclick="changeQty(${index},-1)">−</button>

${item.qty}

<button onclick="changeQty(${index},1)">+</button>

<button onclick="removeItem(${index})">
Remove
</button>

</div>

</div>
`;

});

document.getElementById("cartItems").innerHTML=
html||"<p>Your cart is empty.</p>";

}

function changeQty(index,value){

kmartCart[index].qty+=value;

if(kmartCart[index].qty<=0){
kmartCart.splice(index,1);
}

updateCart();

}

function removeItem(index){

kmartCart.splice(index,1);

updateCart();

}

function openCart(){

document.getElementById("cartBox").style.display="block";

updateCart();

}

function closeCart(){

document.getElementById("cartBox").style.display="none";

}

function placeOrder(){

const name=
document.getElementById("name").value.trim();

const phone=
document.getElementById("phone").value.trim();

const address=
document.getElementById("address").value.trim();

const payment=
document.getElementById("payment").value;

const message=
document.getElementById("message");

if(!selectedProduct){

message.innerText=
"⚠️ Please select a product first.";

message.style.color="red";

return;

}

if(!name||!phone||!address||!payment){

message.innerText=
"⚠️ Please fill all details.";

message.style.color="red";

return;

}

message.innerText=
"✅ Order information received successfully!";

message.style.color="green";

}

function searchProducts(){

const value=
document.getElementById("search").value.toLowerCase();

document.querySelectorAll(".card").forEach(function(card){

const text=
card.innerText.toLowerCase();

card.style.display=
text.includes(value)?"block":"none";

});

}

function sellerLogin(){

const pin=
document.getElementById("sellerPin").value;

if(pin==="NK99@#"){

document.getElementById("sellerForm").style.display="block";

alert("✅ Seller Login Successful!");

}else{

alert("❌ Wrong Seller PIN!");

}

}

function addProduct(){

const name=
document.getElementById("productName").value.trim();

const price=
document.getElementById("productPrice").value;
const details=
document.getElementById("productDetails").value.trim();
const image=
document.getElementById("productImage").value.trim();
const stock=
document.getElementById("productStock").value;
if(!name||!price||!details||!image||stock===""){
alert("⚠️ Product name, price, details, image URL aur stock fill karo.");

return;

}

const card=
document.createElement("div");

card.className="card";

card.innerHTML=`

<img src="${image}" alt="${name}">

<h3>${name}</h3>
<p>${details}</p>
<p>📦 Stock: ${stock}</p>
<p class="price">₹${price}</p>

<div class="buttons">

<button class="cart-add"
onclick="addToCart('${name.replace(/'/g,"\\'")}',${price})">

🛒 Cart

</button>

<button class="buy"
onclick="buyNow('${name.replace(/'/g,"\\'")}',${price})">

⚡ Buy

</button>

</div>

`;

document.getElementById("products").appendChild(card);

document.getElementById("productName").value="";
document.getElementById("productPrice").value="";
document.getElementById("productImage").value="";
document.getElementById("productDetails").value="";
document.getElementById("productStock").value="";
alert("✅ Product added!");

}

</script>
<section class="checkout">
  <h2>👤 K-Mart Customer Account</h2>

  <p id="loginStatus" style="margin:10px 0;">
    🔴 Not logged in
  </p>

  <input
    id="customerEmail"
    type="email"
    placeholder="Email Address">

  <input
    id="customerPassword"
    type="password"
    placeholder="Password">

  <button
    class="place"
    onclick="kmartSignup()">
    📝 Create Account
  </button>

  <button
    class="place"
    onclick="kmartLogin()"
    style="margin-top:8px;">
    🔐 Login
  </button>

  <button
    onclick="kmartLogout()"
    style="width:100%;padding:12px;margin-top:8px;">
    Logout
  </button>
</section>
  <script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function() {
    navigator.serviceWorker.register("./sw.js")
      .then(function() {
        console.log("K-Mart Service Worker Registered");
      })
      .catch(function(error) {
        console.log("Service Worker Error:", error);
      });
  });
}
  </script>
</body>
  </html>
