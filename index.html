<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K Mart - Online Shopping</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
    }

    header {
      background: #2874f0;
      color: white;
      padding: 15px;
      text-align: center;
    }

    header h1 {
      margin-bottom: 10px;
    }

    .search {
      width: 90%;
      max-width: 600px;
      padding: 12px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 15px;
      padding: 20px;
      max-width: 1100px;
      margin: auto;
    }

    .product {
      background: white;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .product .emoji {
      font-size: 60px;
      margin: 10px;
    }

    .product h3 {
      margin: 8px 0;
    }

    .price {
      color: #e53935;
      font-weight: bold;
      font-size: 18px;
      margin: 8px;
    }

    button {
      background: #ff9f00;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #fb8c00;
    }

    .cart {
      background: white;
      margin: 20px auto;
      padding: 20px;
      max-width: 600px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .cart h2 {
      margin-bottom: 10px;
    }

    footer {
      background: #172337;
      color: white;
      text-align: center;
      padding: 20px;
      margin-top: 30px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🛒 K Mart</h1>
    <p>Online Shopping Made Easy</p>
    <br>
    <input
      class="search"
      type="text"
      id="search"
      placeholder="Search products..."
      onkeyup="searchProducts()"
    >
  </header>

  <section class="products" id="products">

    <div class="product">
      <div class="emoji">📱</div>
      <h3>Smartphone</h3>
      <div class="price">₹9,999</div>
      <button onclick="addToCart('Smartphone', 9999)">Add to Cart</button>
    </div>

    <div class="product">
      <div class="emoji">🎧</div>
      <h3>Headphones</h3>
      <div class="price">₹799</div>
      <button onclick="addToCart('Headphones', 799)">Add to Cart</button>
    </div>

    <div class="product">
      <div class="emoji">⌚</div>
      <h3>Smart Watch</h3>
      <div class="price">₹1,499</div>
      <button onclick="addToCart('Smart Watch', 1499)">Add to Cart</button>
    </div>

    <div class="product">
      <div class="emoji">👟</div>
      <h3>Sports Shoes</h3>
      <div class="price">₹1,299</div>
      <button onclick="addToCart('Sports Shoes', 1299)">Add to Cart</button>
    </div>

    <div class="product">
      <div class="emoji">🎒</div>
      <h3>Backpack</h3>
      <div class="price">₹699</div>
      <button onclick="addToCart('Backpack', 699)">Add to Cart</button>
    </div>

    <div class="product">
      <div class="emoji">👕</div>
      <h3>T-Shirt</h3>
      <div class="price">₹499</div>
      <button onclick="addToCart('T-Shirt', 499)">Add to Cart</button>
    </div>

  </section>

  <section class="cart">
    <h2>🛒 Your Cart</h2>
    <p>Items: <span id="cartCount">0</span></p>
    <p>Total: ₹<span id="cartTotal">0</span></p>
  </section>

  <footer>
    <p>© 2026 K Mart. All Rights Reserved.</p>
    <p>Easy & Simple Online Shopping</p>
  </footer>

  <script>
    let cartCount = 0;
    let cartTotal = 0;

    function addToCart(name, price) {
      cartCount++;
      cartTotal += price;

      document.getElementById("cartCount").textContent = cartCount;
      document.getElementById("cartTotal").textContent = cartTotal;

      alert(name + " added to cart!");
    }

    function searchProducts() {
      const search =
        document.getElementById("search").value.toLowerCase();

      const products =
        document.querySelectorAll(".product");

      products.forEach(function(product) {
        const name =
          product.querySelector("h3").textContent.toLowerCase();

        product.style.display =
          name.includes(search) ? "block" : "none";
      });
    }
  </script>

</body>
</html>
