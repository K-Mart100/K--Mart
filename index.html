<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-Mart | Online Shopping</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f5f5;
  color:#222;
}

header{
  background:#2874f0;
  color:white;
  padding:15px;
  text-align:center;
}

header h1{
  font-size:28px;
}

.search{
  width:90%;
  max-width:500px;
  margin-top:12px;
  padding:12px;
  border:0;
  border-radius:5px;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
  padding:20px;
}

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:50px 20px;
  background:white;
  border-radius:10px;
}

.checkout{
  background:white;
  margin:20px;
  padding:20px;
  border-radius:10px;
}

.checkout input,
.checkout textarea,
.checkout select{
  width:100%;
  padding:12px;
  margin:7px 0;
  border:1px solid #ccc;
  border-radius:5px;
}

button{
  background:#2874f0;
  color:white;
  border:0;
  padding:12px 20px;
  border-radius:5px;
  cursor:pointer;
}

#message{
  margin-top:12px;
  font-weight:bold;
}
</style>
</head>

<body>

<header>
  <h1>🛒 K-Mart</h1>
  <input
    class="search"
    id="search"
    type="text"
    placeholder="Search your products..."
  >
</header>

<section class="products" id="products">

  <!-- YOUR PRODUCTS WILL BE ADDED HERE -->

  <div class="empty">
    <h2>Your Products</h2>
    <p>Products will appear here.</p>
  </div>

</section>

<section class="checkout">
  <h2>🛍️ Checkout</h2>

  <p id="cartInfo">No product selected.</p>

  <input id="name" type="text" placeholder="Full Name">
  <input id="phone" type="tel" placeholder="Phone Number">
  <textarea id="address" placeholder="Delivery Address"></textarea>

  <select id="payment">
    <option value="">Select Payment Method</option>
    <option>Cash on Delivery</option>
    <option>UPI</option>
    <option>Card</option>
  </select>

  <button onclick="placeOrder()">Place Order</button>

  <p id="message"></p>
</section>

<script>
function placeOrder(){

  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;
  const address = document.getElementById("address").value;
  const payment = document.getElementById("payment").value;

  if(!name || !phone || !address || !payment){
    document.getElementById("message").innerText =
      "⚠️ Please fill all details.";
    return;
  }

  document.getElementById("message").innerText =
    "✅ Order information filled successfully.";
}
</script>

</body>
</html>
